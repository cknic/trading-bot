services:
  bot:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: trading-bot-bot
    restart: unless-stopped
    env_file:
      - /run/trading/secrets.env
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - RUN_DIR=/run/trading
      - LIVE_LATCH_FILE=/run/trading/LIVE_LATCH
      - REQUIRE_LIVE_LATCH=1
    volumes:
      - ./config:/config:ro
      - ./data:/data
      - trading-run:/run/trading
    command: ["python", "-u", "/app/app/main.py"]

  api:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: trading-bot-api
    restart: unless-stopped
    env_file:
      - /run/trading/secrets.env
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - DATA_DIR=/data
      - RUN_DIR=/run/trading
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - LIVE_LATCH_FILE=/run/trading/LIVE_LATCH
      - REQUIRE_LIVE_LATCH=1
    volumes:
      - ./config:/config:ro
      - ./data:/data
      - trading-run:/run/trading
    ports:
      - "8080:8080"
    command: ["uvicorn", "app.web.server:app", "--host", "0.0.0.0", "--port", "8080"]

  # ----------------------------------------------------------------
  # PHASE 2: IBKR STOCK TRADING
  # ----------------------------------------------------------------
  
  # The Connection Portal (Headless IB Gateway)
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    container_name: sent_gateway
    restart: always
    privileged: true
    ports:
      - "4001:4001"
      - "4002:4002"
      - "5900:5900"
    env_file:
      - /run/trading/secrets.env
    environment:
      - TRADING_MODE=paper
      - ALLOWED_IPS=yes
      # --- NEW AUTO-PILOT SETTINGS ---
      # 1. If another session exists (e.g. your browser), kick it off and take over.
      - EXISTING_SESSION_DETECTED_ACTION=primary
      # 2. Auto-accept API connections (prevents "Accept Connection?" popups)
      - ACCEPT_INCOMING_CONNECTION_ACTION=accept
      # 3. Aggressively dismiss standard warnings
      - BYPASS_WARNINGS=true
      - IGNORE_IB_WARNINGS=yes
      - VNC_SERVER_PASSWORD=123456
      - DISPLAY=:0
    volumes:
      - ./data/ibkr_settings:/root/Jts

  # The Execution Engine (Stocks)
  bot-stocks:
    build:
      context: .                  # <--- FIXED: Build from root
      dockerfile: app/Dockerfile  # <--- FIXED: Point to file
    image: trading-bot-stocks     # Added image tag for clarity
    container_name: sent_bot_stocks
    restart: unless-stopped
    # <--- FIXED: Path matches where Dockerfile put the code (/app/app/...)
    env_file:
      - /run/trading/secrets.env
    command: ["python", "-u", "/app/app/main_stocks.py"] 
    volumes:
      - ./config:/config:ro
      - ./data:/data
      - trading-run:/run/trading
    environment:
      - DATA_DIR=/data
      - IBKR_API_PORT=4004
      - REQUIRE_LIVE_LATCH=1
    depends_on:
      - ib-gateway

volumes:
  trading-run: