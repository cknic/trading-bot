kraken:
  base_url: "https://api.kraken.com"
  pairs:
    - "XXBTZUSD"   # Bitcoin (Keep)
    - "XETHZUSD"   # Ethereum (Keep)
    - "SOLUSD"     # Solana (High Volatility)
    - "XRPUSD"     # XRP (High Liquidity)
    - "ADAUSD"     # Cardano
    - "XDGUSD"   # Dogecoin (Uncomment if you want higher risk)

trading:
  mode: "dry_run"          # dry_run | live
  order_type: "limit"      # limit | market
  quote_notional_usd: 20.0
  poll_seconds: 60

fees:
  taker_fee_pct: 0.26     # Standard Kraken Taker fee (0.26%)
  operational_cost_daily_usd: 0.00 # NEW: Daily Azure/Server Cost (Deducted every 24h)

safety:
  max_spread_pct: 0.30
  max_slippage_pct: 0.50
  limit_offset_pct: 0.02

strategy:
  timeframe_minutes: 60
  sma_short: 10
  sma_long: 30
  min_candles: 60
  simulate_fills_in_dry_run: true
  decay_exit:
    initial_stop_pct: 0.10
    decay_daily_pct: 0.01
    min_stop_pct: 0.005
    max_hold_days: 14

cooldown:
  hours_after_trade: 4

fill_sim:
  mode: "probabilistic"     # cross_only | probabilistic
  partial_fills: false      # keep false for now
  random_seed: 42           # deterministic behavior

pnl:
  write_csv: true
  csv_path: "/data/trades.csv"
  summary_path: "/data/pnl.json"