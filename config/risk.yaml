# /config/risk.yaml
# Risk Management Configuration

safety:
  fail_closed: true

# Account-level risk limits
account:
  # Percentage-based (for future use)
  max_drawdown_pct: 10.0
  max_daily_loss_pct: 3.0
  # USD-based circuit breakers (active now)
  max_drawdown_usd: 10.0
  max_daily_loss_usd: 0.10

# Per-trade risk limits
trade:
  max_open_positions: 10
  max_notional_usd_per_trade: 50.0
  # Daily trade caps
  max_trades_per_day: 6
  max_trades_per_day_per_pair: 3
  # Choice C: do NOT consume daily trade count in dry-run
  count_trades_in_dry_run: false

# Pyramiding (adding to winners)
pyramid:
  max_entries: 3                    # Max times to add to a position
  spacing_pct: 2.0                  # Price must move up X% from avg before adding
  min_interval_seconds: 300         # Minimum 5 min between entries
  max_position_usd: 500             # Maximum total position per asset
  max_portfolio_pct: 20             # Max % of portfolio in single asset

# Leverage caps by asset class
leverage_caps:
  stocks: 1.25
  crypto: 1.50

# Stop loss / Take profit (future implementation)
exit_rules:
  stop_loss_pct: 10                 # Exit if down X% from average entry (0 = disabled)
  trailing_stop_pct: 0              # Trailing stop % (0 = disabled)
  take_profit_pct: 0                # Take profit at X% (0 = disabled)

# File-based controls (maps to UI buttons)
controls:
  pause_file: "/run/trading/PAUSE"
  kill_switch_file: "/run/trading/KILL_SWITCH"