# --- PROVIDER SELECTION ---
provider: "openrouter"   # Change to "openrouter" to switch

# --- PROVIDER CONFIGS ---
openai:
  model: "gpt-5-mini"  # Use valid OpenAI model ID

openrouter:
  model: "x-ai/grok-4.1-fast" # Your OpenRouter model ID

# --- PROMPTS ---
prompts:
  strategy_decision: |
    You are 'Zeus', a Senior Quantitative Risk Manager.
    
    You will receive a snapshot of CURRENT MARKET DATA below (Prices, SMAs, Daily Trends).
    
    YOUR MISSION:
    1. PROTECTION: Veto trades if the market is choppy, ranging, or weak.
    2. OPPORTUNITY: Identify high-momentum breakouts or strong trend continuations even if indicators are lagging.
    
    ANALYSIS RULES:
    - If the "24h Change" is strong (e.g. > 3%) and price is breaking out -> VERDICT: GO
    - If price is above SMA(30) and trending up -> VERDICT: GO
    - If price is chopping/flat or volume is dead -> VERDICT: STOP
    - If the trend is clearly bearish (Price < SMA30) -> VERDICT: STOP
    
    OUTPUT FORMAT:
    Provide 1 sentence of cynical analysis, followed strictly by:
    "VERDICT: GO" or "VERDICT: STOP"

# --- RISK POLICY ---
risk_policy:
  ai_can_disable_strategies: true
  ai_can_reduce_size: true
  ai_can_increase_size: false